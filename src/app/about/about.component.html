<section id="sobre-mi" class="ed-section section-sobre-mi">
  <header class="ed-section-header">
    <span class="ed-section-num">06</span>
    <div class="ed-section-titles">
      <h2 class="ed-section-title">{{ ts.t.about.accordionTitle }}</h2>
      <p class="ed-section-sub">{{ ts.t.about.accordionSub }}</p>
    </div>
  </header>

  <div class="about-editorial-grid">
    @for (panel of ts.t.about.panels; track panel.title; let i = $index) {
      <article class="about-block">
        <div class="about-block-head">
          <span class="about-block-num">06.{{ i + 1 }}</span>
          <h3 class="about-block-title">{{ panel.title }}</h3>
        </div>
        <p class="about-block-text">{{ panel.content }}</p>
      </article>
    }
  </div>
</section>
